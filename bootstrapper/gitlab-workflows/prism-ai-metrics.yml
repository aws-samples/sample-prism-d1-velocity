# prism-ai-metrics.yml — Per-merge delivery telemetry (GitLab).
#
# Include this file in your .gitlab-ci.yml:
#   include:
#     - local: '.prism/gitlab-workflows/prism-ai-metrics.yml'
#
# DESIGN: emits immutable per-MR FACTS and computes no rates. All aggregation
# (frequency, lead-time percentiles, change-failure rate, MTTR) happens at query
# time in the dashboard widgets. See the GitHub twin at
# bootstrapper/github-workflows/prism-ai-metrics.yml for the full rationale.
#
# AI origin is NOT computed here — it is resolved at render time by joining
# pr.commit_shas against the codeburn attribution store. See
# docs/DATA-ARCHITECTURE.md → "AI Origin Resolution: Deferred Attribution Join".
#
# Replaces the former prism-dora-weekly.yml, which published a parallel 7-day
# aggregate that no dashboard consumed.
#
# Required setup:
#   - CI/CD variable PRISM_METRICS_ROLE_ARN (IAM role ARN with events:PutEvents)
#   - .prism/config.json committed to the repo (optional; defaults to no_team)
#   - AWS credentials configured via OIDC

prism-ai-metrics:
  stage: test
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  variables:
    AWS_DEFAULT_REGION: us-west-2
  before_script:
    - yum install -y -q jq git
    - git fetch --unshallow || true
    - |
      # Assume AWS role via GitLab OIDC
      if [[ -n "${PRISM_METRICS_ROLE_ARN}" && -n "${GITLAB_OIDC_TOKEN}" ]]; then
        echo "Assuming role via OIDC: ${PRISM_METRICS_ROLE_ARN}"
        if CREDS=$(aws sts assume-role-with-web-identity \
          --role-arn "${PRISM_METRICS_ROLE_ARN}" \
          --role-session-name "gitlab-ci-${CI_JOB_ID}" \
          --web-identity-token "${GITLAB_OIDC_TOKEN}" \
          --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
          --output text 2>&1); then
          export AWS_ACCESS_KEY_ID=$(echo "${CREDS}" | awk '{print $1}')
          export AWS_SECRET_ACCESS_KEY=$(echo "${CREDS}" | awk '{print $2}')
          export AWS_SESSION_TOKEN=$(echo "${CREDS}" | awk '{print $3}')
          echo "✓ OIDC credentials acquired."
        else
          echo "⚠️ OIDC assume-role failed: ${CREDS}"
        fi
      elif [[ -n "${PRISM_METRICS_ROLE_ARN}" ]]; then
        echo "⚠️ PRISM_METRICS_ROLE_ARN set but GITLAB_OIDC_TOKEN is empty."
      fi
  script:
    - |
      if ! aws sts get-caller-identity &>/dev/null; then
        echo "⚠️ No AWS credentials. Set PRISM_METRICS_ROLE_ARN or configure AWS access."
        exit 0
      fi

      TEAM_ID=$(jq -r '.team_id // "no_team"' .prism/config.json 2>/dev/null || echo "no_team")

      # Commit range for this merge
      if [[ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA}" ]]; then
        BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      else
        BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
      fi
      HEAD_SHA="${CI_COMMIT_SHA}"

      # --- Commit SHAs: immutable facts for deferred origin resolution.
      #
      # --no-merges for the same reason as the GitHub workflow: under a
      # merge-commit strategy CI_COMMIT_SHA is the merge commit GitLab created,
      # which no developer machine authored and codeburn can therefore never
      # attribute. Counting it caps Attribution Coverage below 100% for a fully
      # onboarded team. Harmless under squash or fast-forward, where the range
      # holds no merge commits to exclude.
      COMMIT_SHAS=$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}" 2>/dev/null | head -50 | jq -R . | jq -sc . || echo '[]')
      TOTAL_COMMITS=$(git rev-list --no-merges --count "${BASE_SHA}..${HEAD_SHA}" 2>/dev/null || echo "1")

      # --- Lead time: MR open → now (this job runs on the post-merge push).
      LEAD_TIME_SECONDS=0
      if [[ -n "${CI_MERGE_REQUEST_CREATED_AT}" ]]; then
        CREATED_TS=$(date -d "${CI_MERGE_REQUEST_CREATED_AT}" +%s 2>/dev/null || echo "0")
        if [[ "${CREATED_TS}" -gt 0 ]]; then
          LEAD_TIME_SECONDS=$(( $(date +%s) - CREATED_TS ))
          [[ "${LEAD_TIME_SECONDS}" -lt 0 ]] && LEAD_TIME_SECONDS=0
        fi
      fi

      # --- Failure-fix label: change-failure-rate numerator as a per-MR fact.
      # On the post-merge push pipeline CI_MERGE_REQUEST_TITLE is usually unset,
      # so fall back to the merge commit title. Matched via printf against a
      # variable rather than interpolated, since titles are user-controlled.
      FIX_TITLE="${CI_MERGE_REQUEST_TITLE:-${CI_COMMIT_TITLE:-}}"
      if printf '%s' "${FIX_TITLE}" | grep -qiE 'revert|hotfix|rollback'; then
        IS_FAILURE_FIX=true
      else
        IS_FAILURE_FIX=false
      fi

      TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

      # NOTE: no review verdicts here. GitLab approvals would need an API call
      # with a project token; the GitHub twin gets them from the reviews API.
      # Emitted under `pr` (not `mr`) so both CI providers land in the same
      # shape — the processor only persists a known section list.
      PR_EVENT=$(jq -n \
        --arg team_id "${TEAM_ID}" \
        --arg repo "${CI_PROJECT_PATH}" \
        --arg timestamp "${TIMESTAMP}" \
        --argjson lead_time_seconds "${LEAD_TIME_SECONDS}" \
        --argjson is_failure_fix "${IS_FAILURE_FIX}" \
        --argjson total_commits "${TOTAL_COMMITS}" \
        --argjson commit_shas "${COMMIT_SHAS}" \
        --arg mr_iid "${CI_MERGE_REQUEST_IID:-0}" \
        --arg mr_author "${GITLAB_USER_LOGIN}" \
        '{
          team_id: $team_id, repo: $repo, timestamp: $timestamp, prism_level: 2,
          metric: {name: "pr_merged", value: 1, unit: "count"},
          dora: {lead_time_seconds: $lead_time_seconds, is_failure_fix: $is_failure_fix},
          pr: {number: ($mr_iid | tonumber), author: $mr_author,
               reviews_approved: 0, reviews_changes_requested: 0,
               total_commits: $total_commits, commit_shas: $commit_shas}
        }')

      aws events put-events --region "${AWS_DEFAULT_REGION}" \
        --entries "[{
          \"Source\": \"prism.d1.velocity\",
          \"DetailType\": \"prism.d1.pr\",
          \"EventBusName\": \"prism-d1-metrics\",
          \"Detail\": $(echo "${PR_EVENT}" | jq -c '.' | jq -Rs '.')
        }]"

      # Sole deployment signal — deployment_frequency lives ONLY on this event.
      # Carrying it on prism.d1.pr as well double-counted the metric.
      DEPLOY_EVENT=$(jq -n --arg team_id "${TEAM_ID}" --arg repo "${CI_PROJECT_PATH}" --arg timestamp "${TIMESTAMP}" \
        '{team_id: $team_id, repo: $repo, timestamp: $timestamp, prism_level: 2,
         metric: {name: "deployment", value: 1, unit: "count"},
         dora: {deployment_frequency: 1}}')

      aws events put-events --region "${AWS_DEFAULT_REGION}" \
        --entries "[{
          \"Source\": \"prism.d1.velocity\",
          \"DetailType\": \"prism.d1.deploy\",
          \"EventBusName\": \"prism-d1-metrics\",
          \"Detail\": $(echo "${DEPLOY_EVENT}" | jq -c '.' | jq -Rs '.')
        }]"

      echo "Emitted prism.d1.pr + prism.d1.deploy"
      echo "  lead time: ${LEAD_TIME_SECONDS}s · failure fix: ${IS_FAILURE_FIX} · commits: ${TOTAL_COMMITS}"
