# claude-plugin.yml -- checks for the Claude Code plugin on PRs that touch it. No secrets, read-only token.

name: Claude Code plugin

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'claude-plugin/**'
      - '.claude-plugin/**'
      - '.github/workflows/claude-plugin.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: JSON files parse
        run: for f in .claude-plugin/marketplace.json claude-plugin/.claude-plugin/plugin.json claude-plugin/.mcp.json claude-plugin/hooks/hooks.json; do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || exit 1; done
      - name: SessionStart hook test
        run: node --test claude-plugin/test/session-start.test.mjs
