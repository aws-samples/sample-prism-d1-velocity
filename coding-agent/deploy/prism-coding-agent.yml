# prism-coding-agent.yml — Autonomous issue → fix → PR, via an AgentCore harness.
#
# Installed by: prism-cli bootstrapper install-coding-agent
#
# This file deliberately does NOT live in bootstrapper/github-workflows/.
# install-github-workflows copies every .yml in that directory, so putting it
# there would hand an autonomous, Bedrock-billing, branch-pushing agent to every
# repo that ran the workflow installer.
#
#
# WHAT RUNS WHERE
#
# The agent runs on AgentCore, not here. This workflow is the thin client: it
# resolves the issue, invokes the harness, applies the patch it returns, and opens
# a pull request. That split is what keeps the harness's credentials read-only --
# it never pushes, so it needs no write access to any repository, and the token
# that opens the PR is this run's own ephemeral, repo-scoped GITHUB_TOKEN.
#
# One harness serves every toolchain. It ships mise and installs what the
# repository declares in .tool-versions at session start, so there is no
# per-language routing to configure here.
#
#
# AUTHORIZATION MODEL
#
# The trigger is `issues: [labeled]`, gated on a specific label. That is the
# security control, and it is load-bearing: anybody with a GitHub account can
# open an issue in a public repo, but applying a label requires triage
# permission or above. Triggering on `issues: [opened]` instead would let any
# stranger spend your Bedrock budget and put a branch in your repository.
#
# NOTE: `issues` events only trigger a workflow run if this file exists on the
# DEFAULT branch. You cannot test changes to it from a feature branch -- nothing
# fires, and nothing reports why. Merge first.
#
#
# REQUIRED SETUP
#   - prism-cli bootstrapper setup-github-oidc   (grants bedrock:InvokeModel)
#   - Repository secret PRISM_METRICS_ROLE_ARN
#   - Repository or org variable PRISM_HARNESS_ARN (an ARN is an identifier, not
#     a credential, so it belongs in `vars` -- and an org variable is inherited by
#     every repo, which is what "deploy the harness once" should feel like)
#   - A label matching AGENT_LABEL below, created in the repo
#   - .coding-agent/config.json committed (written by install-coding-agent)
#
# The agent is NOT vendored into this repository. Only config.json, prompt.md,
# fixtures/ and this file live here; the orchestrator client is fetched at run
# time from the sample repo, and the agent itself runs in an AgentCore harness in
# your own account. That means an agent fix reaches every repo without an N-repo
# migration, which vendoring could not offer.
#
# Pin PRISM_AGENT_REF to a tag or commit SHA for anything you care about. It
# defaults to `main` so the workshop works on day one, but a floating default
# means a third party's push can change what runs in your CI.

name: PRISM Coding Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: string

env:
  PRISM_AWS_REGION: us-west-2
  PRISM_REPO: github.com/${{ github.repository }}
  PRISM_HARNESS_ARN: ${{ vars.PRISM_HARNESS_ARN }}
  # Where the orchestrator client comes from. Overridable as repo/org variables so
  # a fork, an internal mirror, or a pinned SHA needs no edit to this file.
  PRISM_AGENT_REPO: ${{ vars.PRISM_AGENT_REPO || 'aws-samples/sample-prism-d1-velocity' }}
  PRISM_AGENT_REF: ${{ vars.PRISM_AGENT_REF || 'main' }}

permissions:
  id-token: write       # OIDC → AWS
  contents: write       # push the fix branch
  pull-requests: write  # open the PR
  issues: write         # comment the outcome back on the issue

jobs:
  fix-issue:
    # On the label path, run only for the agent label. Any other label added to
    # any issue also fires this workflow, so this condition is what keeps the
    # job from running on every triage action in the repository.
    #
    # The label is a literal here, not an env var, because the `env` context is
    # not available in a job-level `if`. An AGENT_LABEL variable above would look
    # configurable and change nothing — if you rename the label, edit this line.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fail early if no harness is configured
        run: |
          set -euo pipefail
          if [[ -z "${PRISM_HARNESS_ARN}" ]]; then
            echo "::error::PRISM_HARNESS_ARN is not set. Deploy the harness from" \
                 "coding-agent/deploy/Dockerfile and set the repository or org" \
                 "variable. Failing now rather than after commenting on the issue."
            exit 1
          fi

      - name: Resolve the issue to work on
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          # Both branches write the same shape: a GitHub event payload with the
          # issue under an `issue` key, which is what agentcore.invoke reads. The
          # dispatch branch has to wrap it, because `gh issue view` returns a
          # bare issue object.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if ! [[ "${DISPATCH_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "::error::issue_number must be numeric, got '${DISPATCH_NUMBER}'"
              exit 1
            fi
            gh issue view "${DISPATCH_NUMBER}" --json number,title,body,labels \
              | jq '{issue: .}' > /tmp/issue.json
          else
            # Read from the payload rather than re-fetching: avoids a race where
            # the issue is edited between the label and this step.
            jq '{issue: (.issue | {number, title, body, labels})}' \
              "${GITHUB_EVENT_PATH}" > /tmp/issue.json
          fi

          NUMBER=$(jq -r '.issue.number' /tmp/issue.json)
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Working on issue #${NUMBER}: $(jq -r '.issue.title' /tmp/issue.json)"

      - name: Acknowledge on the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" \
            --body "🤖 PRISM coding agent picked this up — [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install runner dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          # Only boto3 -- the agent's own dependencies live in the harness image,
          # not here. This runner never loads a model.
          pip install --quiet boto3

      - name: Fetch the orchestrator client
        id: client
        env:
          AGENT_REPO: ${{ env.PRISM_AGENT_REPO }}
          AGENT_REF: ${{ env.PRISM_AGENT_REF }}
        run: |
          set -euo pipefail
          # Cloned into RUNNER_TEMP, NOT the workspace. actions/checkout can only
          # write under GITHUB_WORKSPACE, and anything there is inside the tree the
          # agent's patch is applied to and committed from -- a client checkout
          # sitting in the working tree is one `git add -A` away from being
          # committed into somebody's fix.
          DEST="${RUNNER_TEMP}/prism-agent"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"

          # init + fetch rather than `clone --branch`, because --branch takes a
          # branch or tag and rejects a commit SHA -- which is exactly what a repo
          # that has pinned PRISM_AGENT_REF will be passing.
          git -C "${DEST}" init -q
          git -C "${DEST}" remote add origin "https://github.com/${AGENT_REPO}.git"
          git -C "${DEST}" sparse-checkout init --cone
          git -C "${DEST}" sparse-checkout set coding-agent
          git -C "${DEST}" fetch -q --depth 1 origin "${AGENT_REF}"
          git -C "${DEST}" checkout -q FETCH_HEAD

          CLIENT="${DEST}/coding-agent"
          if [[ ! -f "${CLIENT}/agentcore/invoke.py" ]]; then
            echo "::error::${AGENT_REPO}@${AGENT_REF} has no coding-agent/agentcore/invoke.py"
            exit 1
          fi
          echo "dir=${CLIENT}" >> "$GITHUB_OUTPUT"
          echo "Client ${AGENT_REPO}@$(git -C "${DEST}" rev-parse --short FETCH_HEAD)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.PRISM_METRICS_ROLE_ARN }}
          aws-region: ${{ env.PRISM_AWS_REGION }}

      - name: Invoke the harness
        id: invoke
        env:
          PRISM_HARNESS_ARN: ${{ env.PRISM_HARNESS_ARN }}
        run: |
          # GitHub runs `run:` blocks under `bash -e`, so a non-zero exit would
          # end the step and skip straight past reporting. `set +e` keeps the exit
          # code as data instead of as control flow.
          set -o pipefail
          set +e
          # --repo is the checkout under test, which is NOT the working directory:
          # this step runs from the client, and config.json lives in the target
          # repo. Passing `.` here would resolve to the client and fail config
          # loading with a confusing "no .coding-agent/config.json".
          python -m agentcore.invoke \
            --repo "${GITHUB_WORKSPACE}" \
            --github-event /tmp/issue.json \
            --patch-out /tmp/fix.patch \
            --result-out /tmp/result.json \
            --transcript-out /tmp/agent-transcript.log \
            --repo-url "${{ github.server_url }}/${{ github.repository }}.git" \
            --ref "${{ github.event.repository.default_branch }}" \
            --region "${PRISM_AWS_REGION}" \
            2>&1 | tee /tmp/invoke.log
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          OUTCOME=$(jq -r '.outcome // "failed"' /tmp/result.json 2>/dev/null || echo failed)
          echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"
          VERIFIED=$(jq -r '.verified // false' /tmp/result.json 2>/dev/null || echo false)
          echo "verified=${VERIFIED}" >> "$GITHUB_OUTPUT"
          echo "Harness outcome: ${OUTCOME} (verified=${VERIFIED}, exit ${EXIT_CODE})"
        working-directory: ${{ steps.client.outputs.dir }}

      - name: Apply the patch
        id: apply
        if: steps.invoke.outputs.outcome == 'patched'
        run: |
          set -euo pipefail
          BRANCH="agent/issue-${{ steps.issue.outputs.number }}"
          git switch -c "${BRANCH}"

          # --check first so a stale or malformed patch is reported as such rather
          # than leaving a half-applied tree behind.
          if ! git apply --check /tmp/fix.patch; then
            echo "::error::the returned patch does not apply to this tree"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git apply /tmp/fix.patch

          NAME=$(jq -r '.agent_name // "PRISM Coding Agent"' .coding-agent/config.json)
          EMAIL=$(jq -r '.agent_email // "prism-agent@example.com"' .coding-agent/config.json)
          SUMMARY=$(jq -r '.summary // "Autonomous fix"' /tmp/result.json)

          git -c "user.name=${NAME}" -c "user.email=${EMAIL}" commit -a -m "$(printf 'fix: %s\n\n%s\n\nCloses #%s\n' \
            "$(jq -r '.issue.title' /tmp/issue.json)" \
            "${SUMMARY}" \
            "${{ steps.issue.outputs.number }}")"

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "files=$(git diff --name-only HEAD~1 HEAD | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          git log --oneline -1

      - name: Open the pull request
        id: pr
        if: steps.apply.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push -u origin "${{ steps.apply.outputs.branch }}"
          VERIFIED=$(jq -r 'if .verified then "The agent ran this repository'"'"'s checks and they passed." else "⚠️ The agent did NOT verify this change. Review with that in mind." end' /tmp/result.json)
          URL=$(gh pr create \
            --title "fix: $(jq -r '.issue.title' /tmp/issue.json)" \
            --body "$(printf 'Closes #%s\n\n%s\n\n%s\n\nGenerated by the PRISM coding agent on AgentCore. Nothing here was merged automatically.\n\n[Run log](%s)\n' \
                "${{ steps.issue.outputs.number }}" \
                "$(jq -r '.summary' /tmp/result.json)" \
                "${VERIFIED}" \
                "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")" \
            --base "${{ github.event.repository.default_branch }}")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Report the outcome on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.invoke.outputs.outcome }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REASON=$(jq -r '.reason // ""' /tmp/result.json 2>/dev/null || echo "")

          case "${OUTCOME:-failed}" in
            patched)
              if [[ -n "${PR_URL}" ]]; then
                BODY=$(printf '✅ **Fix proposed** — %s\n\nNothing has been merged.\n\n[Run log](%s)' "${PR_URL}" "${RUN_URL}")
              else
                BODY=$(printf '⚠️ **The agent produced a patch but it could not be applied or pushed.** See the run log for the reason.\n\n[Run log](%s)' "${RUN_URL}")
              fi
              ;;
            declined)
              # Declining is frequently the right answer -- for an issue asking the
              # agent to weaken a test suite, or one whose premise does not hold.
              # Reporting it as a failure would train people to ignore the signal.
              BODY=$(printf '🛑 **The agent declined to make a change.**\n\n> %s\n\nThis is often correct: the request may ask for something it should refuse, or rest on a premise that does not hold.\n\n[Run log](%s)' "${REASON}" "${RUN_URL}")
              ;;
            *)
              BODY=$(printf '❌ **The agent could not complete this.**\n\n> %s\n\n[Run log](%s)' "${REASON:-see the run log}" "${RUN_URL}")
              ;;
          esac

          gh issue comment "${{ steps.issue.outputs.number }}" --body "${BODY}"

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-run-issue-${{ steps.issue.outputs.number }}
          path: |
            /tmp/invoke.log
            /tmp/result.json
            /tmp/fix.patch
            /tmp/agent-transcript.log
          retention-days: 14
          if-no-files-found: ignore
