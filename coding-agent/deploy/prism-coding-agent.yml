# prism-coding-agent.yml — Autonomous issue → fix → PR, via an AgentCore harness.
#
# Installed by: prism-cli bootstrapper install-coding-agent
#
# WHAT RUNS WHERE
#
# The agent and its full orchestration (clone, toolchain, deps, fix, verify) run
# inside the harness microVM. This workflow is the thin client: it resolves the
# issue, makes one API call, and applies the returned patch.
#
# The split is:
#   - Inside the harness: clone → mise install → npm ci → agent loop → git diff → npm test
#   - On this runner: read issue → call API → apply patch → push → open PR → comment
#
# The harness image contains strands-agents + the full orchestrator. A single
# InvokeAgentRuntimeCommand does everything. No client code is fetched per-run.
#
#
# AUTHORIZATION MODEL
#
# The trigger is `issues: [labeled]`, gated on a specific label. That is the
# security control: anybody can open an issue, but applying a label requires
# triage permission. Private repo access: the GITHUB_TOKEN is passed in the
# clone URL, so it is visible to the model's shell tool for the duration of
# this run (it expires when the run ends).
#
# NOTE: `issues` events only trigger a workflow run if this file exists on the
# DEFAULT branch. You cannot test changes from a feature branch.
#
#
# REQUIRED SETUP
#   - prism-cli bootstrapper setup-github-oidc (grants bedrock-agentcore + SSM + SM)
#   - Repository secret PRISM_METRICS_ROLE_ARN
#   - Repository or org variable PRISM_HARNESS_ARN
#   - A label matching 'agent-fix', created in the repo
#   - .coding-agent/config.json committed (written by install-coding-agent)

name: PRISM Coding Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: string

env:
  PRISM_AWS_REGION: us-west-2
  PRISM_REPO: github.com/${{ github.repository }}
  PRISM_HARNESS_ARN: ${{ vars.PRISM_HARNESS_ARN }}

permissions:
  id-token: write       # OIDC → AWS
  contents: write       # push the fix branch
  pull-requests: write  # open the PR
  issues: write         # comment the outcome

jobs:
  fix-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve the issue
        id: issue
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NUMBER="${{ inputs.issue_number }}"
          else
            NUMBER="${{ github.event.issue.number }}"
          fi
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          # Wrap under an `issue` key for the agent
          gh issue view "${NUMBER}" --json number,title,body \
            | jq '{issue: .}' > /tmp/issue.json
          echo "Issue #${NUMBER}: $(jq -r .issue.title /tmp/issue.json)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Acknowledge on the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" \
            --body "🤖 PRISM coding agent picked this up — [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.PRISM_METRICS_ROLE_ARN }}
          aws-region: ${{ env.PRISM_AWS_REGION }}

      - name: Resolve harness ARN
        id: harness
        run: |
          ARN="${PRISM_HARNESS_ARN}"
          if [[ -z "${ARN}" ]]; then
            ARN=$(aws ssm get-parameter --name /prism/d1/harness-arn \
              --query Parameter.Value --output text 2>/dev/null || echo "")
          fi
          if [[ -z "${ARN}" ]]; then
            echo "::error::No harness ARN (checked variable + SSM /prism/d1/harness-arn)"
            exit 1
          fi
          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"
          echo "Harness: ${ARN}"
          # Extract model from the harness so run.py doesn't need its own default.
          # deploy-harness.sh is the single source of truth for which model to use.
          HARNESS_ID=$(echo "${ARN}" | grep -oP '[^/]+$')
          MODEL_ID=$(python3 -c "
          import boto3, json
          c = boto3.client('bedrock-agentcore-control', region_name='${PRISM_AWS_REGION}')
          h = c.get_harness(harnessId='${HARNESS_ID}')['harness']
          print(h.get('model',{}).get('bedrockModelConfig',{}).get('modelId',''))
          " 2>/dev/null || echo "")
          echo "model=${MODEL_ID}" >> "$GITHUB_OUTPUT"
          echo "Model: ${MODEL_ID}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Invoke the agent
        id: invoke
        run: |
          pip install --quiet boto3

          # Read subdir from config
          SUBDIR=$(python -c "
          import json, pathlib
          cfg = pathlib.Path('.coding-agent/config.json')
          print(json.loads(cfg.read_text()).get('subdir', '.') if cfg.exists() else '.')
          ")

          # The repo URL includes the token so the harness can clone private repos.
          # This token is ephemeral (dies when the run ends) and scoped to this repo.
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          python - <<PYTHON
          import boto3, json, sys, uuid
          from botocore.config import Config as BotoConfig

          RESULT_MARKER = "===PRISM_RESULT_JSON==="
          PATCH_MARKER = "===PRISM_PATCH_START==="
          PATCH_END_MARKER = "===PRISM_PATCH_END==="

          harness_arn = "${{ steps.harness.outputs.arn }}"
          model_id = "${{ steps.harness.outputs.model }}"
          region = "${{ env.PRISM_AWS_REGION }}"
          repo_url = """${REPO_URL}"""
          ref = "${{ github.event.repository.default_branch }}"
          subdir = """${SUBDIR}"""
          issue_json = open("/tmp/issue.json").read().strip().replace("'", "'\\''")
          session_id = f"prism-agent-{uuid.uuid4()}"

          cmd = (
              f"echo '{issue_json}' > /tmp/agent-issue.json && "
              f"python /opt/prism-agent/run.py "
              f"--repo-url '{repo_url}' "
              f"--ref '{ref}' "
              f"--subdir '{subdir}' "
              f"--issue @/tmp/agent-issue.json "
              f"--model-id '{model_id}' "
              f"--region '{region}'"
          )

          print(f"Session: {session_id}", file=sys.stderr)
          client = boto3.client("bedrock-agentcore", region_name=region,
                                config=BotoConfig(read_timeout=1800, connect_timeout=30,
                                                  retries={"max_attempts": 0}))

          # Retry once on transient stream drops (ProtocolError / ReadTimeout)
          MAX_ATTEMPTS = 2
          stdout_parts, exit_code = [], -1
          for attempt in range(1, MAX_ATTEMPTS + 1):
              try:
                  if attempt > 1:
                      session_id = f"prism-agent-{uuid.uuid4()}"
                      print(f"[retry] attempt {attempt}, new session: {session_id}", file=sys.stderr)

                  response = client.invoke_agent_runtime_command(
                      agentRuntimeArn=harness_arn,
                      runtimeSessionId=session_id,
                      body={"command": cmd, "timeout": 1800},
                  )

                  stdout_parts, exit_code = [], -1
                  for event in response.get("stream", []):
                      chunk = event.get("chunk", {})
                      if "contentDelta" in chunk:
                          delta = chunk["contentDelta"]
                          if delta.get("stdout"):
                              stdout_parts.append(delta["stdout"])
                          if delta.get("stderr"):
                              print(delta["stderr"], end="", file=sys.stderr)
                      elif "contentStop" in chunk:
                          exit_code = int(chunk["contentStop"].get("exitCode", -1))
                  break  # success -- exit retry loop

              except Exception as exc:
                  err_name = type(exc).__name__
                  if attempt < MAX_ATTEMPTS and ("Protocol" in err_name or "Timeout" in err_name or "Read" in str(exc)):
                      print(f"::warning::Stream interrupted ({err_name}), retrying...", file=sys.stderr)
                      import time; time.sleep(5)
                      continue
                  print(f"::error::InvokeAgentRuntimeCommand failed: {exc}", file=sys.stderr)
                  json.dump({"outcome": "failed", "reason": str(exc)}, open("/tmp/result.json", "w"))
                  open("/tmp/fix.patch", "w").write("")
                  sys.exit(0)

          stdout = "".join(stdout_parts)

          # Parse structured output
          if RESULT_MARKER in stdout:
              start = stdout.index(RESULT_MARKER) + len(RESULT_MARKER)
              end = stdout.index(PATCH_MARKER) if PATCH_MARKER in stdout else len(stdout)
              result = json.loads(stdout[start:end].strip())
          else:
              result = {"outcome": "failed", "reason": f"no result marker (exit {exit_code})"}

          patch = ""
          if PATCH_MARKER in stdout:
              ps = stdout.index(PATCH_MARKER) + len(PATCH_MARKER) + 1
              pe = stdout.index(PATCH_END_MARKER) if PATCH_END_MARKER in stdout else len(stdout)
              patch = stdout[ps:pe]

          open("/tmp/fix.patch", "w").write(patch)
          json.dump(result, open("/tmp/result.json", "w"), indent=2)

          outcome = result.get("outcome", "failed")
          verified = result.get("verified", False)
          print(f"\nOutcome: {outcome} (verified={verified}, exit {exit_code})", file=sys.stderr)
          PYTHON

          # Export for subsequent steps
          OUTCOME=$(python -c "import json; print(json.load(open('/tmp/result.json')).get('outcome','failed'))")
          echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"

      - name: Check push result
        id: apply
        if: steps.invoke.outputs.outcome == 'patched'
        run: |
          # Push now happens inside the harness (run.py). Extract results.
          BRANCH=$(python -c "import json; print(json.load(open('/tmp/result.json')).get('branch',''))")
          SHA=$(python -c "import json; print(json.load(open('/tmp/result.json')).get('sha',''))")
          PUSH_ERR=$(python -c "import json; print(json.load(open('/tmp/result.json')).get('push_error',''))")

          if [[ -n "${PUSH_ERR}" ]]; then
            echo "::error::Push failed inside harness: ${PUSH_ERR}"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ -z "${BRANCH}" ]]; then
            echo "::error::No branch in result — push may have been skipped"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "Pushed: ${BRANCH} (${SHA})"

      - name: Open the pull request
        if: steps.apply.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERIFIED=$(python -c "import json; print(json.load(open('/tmp/result.json')).get('verified', False))")
          BADGE=""
          if [[ "${VERIFIED}" == "True" ]]; then
            BADGE="✅ Tests pass in the harness"
          else
            BADGE="⚠️ Not independently verified"
          fi

          # Extract changed files and summary from result
          FILES=$(python -c "
          import json
          r = json.load(open('/tmp/result.json'))
          files = r.get('changed_files', [])
          print(', '.join(f'\`{f}\`' for f in files) if files else '(unknown)')
          ")

          SUMMARY=$(python -c "
          import json
          r = json.load(open('/tmp/result.json'))
          # The patch itself serves as the summary — show the diffstat
          patch = r.get('patch', '')
          lines = [l for l in patch.splitlines() if l.startswith('+') or l.startswith('-')]
          adds = len([l for l in lines if l.startswith('+') and not l.startswith('+++')])
          dels = len([l for l in lines if l.startswith('-') and not l.startswith('---')])
          print(f'{adds} insertion(s), {dels} deletion(s)')
          ")

          # Build rich PR body
          MODEL=$(python -c "import json; print(json.load(open('/tmp/result.json')).get('model', 'unknown'))")
          IN_TOK=$(python -c "import json; print(json.load(open('/tmp/result.json')).get('usage', {}).get('input_tokens', 0))")
          OUT_TOK=$(python -c "import json; print(json.load(open('/tmp/result.json')).get('usage', {}).get('output_tokens', 0))")
          COST=$(python -c "
          import json
          r = json.load(open('/tmp/result.json'))
          cost = r.get('cost_usd', 0)
          print(f'\${cost:.2f}')
          ")
          PR_SUMMARY=$(python -c "import json; r=json.load(open('/tmp/result.json')); s=r.get('summary',''); print(s) if s else None")

          BRANCH="${{ steps.apply.outputs.branch }}"
          PR_BODY="Fixes #${{ steps.issue.outputs.number }}

          ${BADGE}

          ${PR_SUMMARY}

          **Changed files:** ${FILES}
          **Diff:** ${SUMMARY}

          ---
          **Model:** \`${MODEL}\` | **Tokens:** ${IN_TOK} in / ${OUT_TOK} out | **Cost:** ${COST}
          *Authored by the [PRISM coding agent](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).*"

          # Check if a PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [[ -n "${EXISTING_PR}" ]]; then
            echo "PR #${EXISTING_PR} already exists — adding comment with new run results"
            gh pr comment "${EXISTING_PR}" --body "### 🔄 New commit pushed

          ${BADGE}

          ${PR_SUMMARY}

          **Changed files:** ${FILES}
          **Diff:** ${SUMMARY}

          ---
          **Model:** \`${MODEL}\` | **Tokens:** ${IN_TOK} in / ${OUT_TOK} out | **Cost:** ${COST}
          *[Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "${BRANCH}" \
              --title "fix: $(jq -r '.issue.title' /tmp/issue.json)" \
              --body "${PR_BODY}"
          fi

      - name: Report outcome on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTCOME=$(cat /tmp/result.json 2>/dev/null | jq -r '.outcome // "unknown"')
          REASON=$(cat /tmp/result.json 2>/dev/null | jq -r '.reason // ""' | head -c 500)
          SUMMARY=$(cat /tmp/result.json 2>/dev/null | jq -r '.summary // ""' | head -c 1000)
          IN_TOK=$(cat /tmp/result.json 2>/dev/null | jq -r '.usage.input_tokens // 0')
          OUT_TOK=$(cat /tmp/result.json 2>/dev/null | jq -r '.usage.output_tokens // 0')
          MODEL=$(cat /tmp/result.json 2>/dev/null | jq -r '.model // "unknown"')
          COST=$(python -c "
          import json
          r = json.load(open('/tmp/result.json'))
          cost = r.get('cost_usd', 0)
          print(f'\${cost:.2f}')
          " 2>/dev/null || echo '\$0.00')
          BRANCH=$(cat /tmp/result.json 2>/dev/null | jq -r '.branch // ""')
          SHA=$(cat /tmp/result.json 2>/dev/null | jq -r '.sha // ""' | head -c 8)

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          case "${OUTCOME}" in
            patched)
              BODY="### ✅ Fix applied

          ${SUMMARY}

          **PR branch:** \`${BRANCH}\` (${SHA})
          **Model:** \`${MODEL}\` | **Tokens:** ${IN_TOK} in / ${OUT_TOK} out | **Cost:** ${COST}
          **Run:** [workflow log](${RUN_URL})" ;;
            declined)
              BODY="### 🛑 Declined

          The agent could not confirm a fix was needed.

          > ${REASON}

          **Model:** \`${MODEL}\` | **Tokens:** ${IN_TOK} in / ${OUT_TOK} out | **Cost:** ${COST}
          **Run:** [workflow log](${RUN_URL})

          _If this is wrong, add more reproduction details to the issue body and re-label \`agent-fix\`._" ;;
            *)
              BODY="### ❌ Failed

          > ${REASON}

          **Model:** \`${MODEL}\` | **Tokens:** ${IN_TOK} in / ${OUT_TOK} out | **Cost:** ${COST}
          **Run:** [workflow log](${RUN_URL})" ;;
          esac

          gh issue comment "${{ steps.issue.outputs.number }}" --body "${BODY}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-run-issue-${{ steps.issue.outputs.number }}
          path: |
            /tmp/result.json
            /tmp/fix.patch
          retention-days: 14
          if-no-files-found: ignore
