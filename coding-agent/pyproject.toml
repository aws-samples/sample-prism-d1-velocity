[project]
name = "prism-coding-agent"
version = "0.1.0"
description = "PRISM D1 Velocity — autonomous coding agent that fixes GitHub issues and opens PRs"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.1.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
prism-coding-agent = "agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
